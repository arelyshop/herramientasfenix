<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector y Editor de Texto Limpio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para el placeholder en contenteditable */
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #9ca3af;
            pointer-events: none;
            display: block; /* Para que el cursor se posicione correctamente */
        }
        
        /* Ocultar barra de desplazamiento para un look más limpio, pero permitir scroll */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Tipografía optimizada para lectura */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body class="bg-[#fcfcfc] text-gray-800 antialiased min-h-screen flex flex-col selection:bg-blue-200 selection:text-blue-900 transition-colors duration-300" id="body">

    <!-- Barra de herramientas superior -->
    <header class="sticky top-0 z-10 bg-[#fcfcfc]/90 backdrop-blur-md border-b border-gray-200 shadow-sm transition-colors duration-300" id="header">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <h1 class="text-lg font-semibold text-gray-700 select-none">Lector Sin Límites</h1>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Contador de palabras -->
                <span id="wordCount" class="text-xs text-gray-500 font-medium mr-2 select-none">0 palabras</span>

                <!-- Botón Modo Oscuro -->
                <button id="themeBtn" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors tooltip" title="Cambiar tema">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Botón de Reproducción TTS Básico -->
                <button id="playBtn" class="flex items-center space-x-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-sm font-medium transition-colors shadow-sm">
                    <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="playText">Leer texto</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Área principal de edición. Usamos <article> para que Edge lo detecte como contenido principal -->
    <main class="flex-grow flex flex-col justify-start max-w-4xl w-full mx-auto p-6 md:p-12">
        
        <!-- Instrucción sutil para usuarios de Edge -->
        <div class="mb-6 text-sm text-gray-400 select-none flex items-start space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p><strong>Tip para Microsoft Edge:</strong> Pega tu texto aquí. Puedes usar el botón de arriba, o presionar <kbd class="bg-gray-100 border border-gray-300 rounded px-1 text-xs">Ctrl</kbd> + <kbd class="bg-gray-100 border border-gray-300 rounded px-1 text-xs">Shift</kbd> + <kbd class="bg-gray-100 border border-gray-300 rounded px-1 text-xs">U</kbd> para usar la excelente voz neuronal nativa de Edge.</p>
        </div>

        <article 
            id="editor" 
            contenteditable="true" 
            data-placeholder="Haz clic aquí y comienza a escribir o pega tu texto sin límites..."
            class="outline-none text-lg md:text-xl leading-relaxed whitespace-pre-wrap flex-grow"
            spellcheck="false"
        ></article>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const wordCount = document.getElementById('wordCount');
        const themeBtn = document.getElementById('themeBtn');
        const body = document.getElementById('body');
        const header = document.getElementById('header');
        
        let isPlaying = false;
        let isDarkMode = false;
        let synth = window.speechSynthesis;
        let utterance = null;

        // 1. Manejo de pegado (Paste) para asegurar que solo entre texto limpio (sin estilos raros)
        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            // Obtener solo el texto plano
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            // Insertarlo en el editor
            document.execCommand('insertText', false, text);
        });

        // 2. Contador de palabras
        editor.addEventListener('input', updateWordCount);
        function updateWordCount() {
            const text = editor.innerText || '';
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            wordCount.innerText = `${words.length} palabra${words.length !== 1 ? 's' : ''}`;
        }

        // 3. Sistema básico de Texto a Voz (TTS) como alternativa
        playBtn.addEventListener('click', () => {
            const textToRead = editor.innerText.trim();
            
            if (!textToRead) {
                alert("Por favor, introduce algún texto para leer.");
                return;
            }

            if (isPlaying) {
                // Detener lectura
                synth.cancel();
                setPlayState(false);
            } else {
                // Iniciar lectura
                utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'es-ES'; // Intentar forzar español
                
                // Eventos para cambiar el botón cuando termine
                utterance.onend = () => setPlayState(false);
                utterance.onerror = () => setPlayState(false);
                
                synth.speak(utterance);
                setPlayState(true);
            }
        });

        function setPlayState(playing) {
            isPlaying = playing;
            if (playing) {
                playBtn.classList.replace('bg-blue-600', 'bg-red-500');
                playBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                playText.innerText = "Detener";
                playIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10h6v4H9z" />`;
            } else {
                playBtn.classList.replace('bg-red-500', 'bg-blue-600');
                playBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                playText.innerText = "Leer texto";
                playIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />`;
            }
        }

        // Cancelar síntesis si el usuario cierra la ventana o recarga
        window.onbeforeunload = () => {
            if (synth) synth.cancel();
        };

        // 4. Modo Oscuro / Claro
        themeBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                body.classList.replace('bg-[#fcfcfc]', 'bg-gray-900');
                body.classList.replace('text-gray-800', 'text-gray-300');
                header.classList.replace('bg-[#fcfcfc]/90', 'bg-gray-900/90');
                header.classList.replace('border-gray-200', 'border-gray-800');
                document.querySelector('h1').classList.replace('text-gray-700', 'text-gray-200');
                themeBtn.classList.replace('hover:bg-gray-200', 'hover:bg-gray-700');
                themeBtn.classList.replace('text-gray-600', 'text-gray-400');
                document.getElementById('themeIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`; // Icono Sol
            } else {
                body.classList.replace('bg-gray-900', 'bg-[#fcfcfc]');
                body.classList.replace('text-gray-300', 'text-gray-800');
                header.classList.replace('bg-gray-900/90', 'bg-[#fcfcfc]/90');
                header.classList.replace('border-gray-800', 'border-gray-200');
                document.querySelector('h1').classList.replace('text-gray-200', 'text-gray-700');
                themeBtn.classList.replace('hover:bg-gray-700', 'hover:bg-gray-200');
                themeBtn.classList.replace('text-gray-400', 'text-gray-600');
                document.getElementById('themeIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`; // Icono Luna
            }
        });

        // Enfoque automático al abrir
        window.onload = () => {
            editor.focus();
        };
    </script>
</body>
</html>
