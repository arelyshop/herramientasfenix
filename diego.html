<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Productos</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Librería jsPDF para crear PDFs nativos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Plugin AutoTable para hacer tablas nativas en jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- Cabecera -->
        <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="ph ph-receipt"></i>
                    Cotizador de Productos
                </h1>
                <p class="text-blue-100 text-sm mt-1">Añade productos y genera un documento PDF nativo con imágenes.</p>
            </div>
            <!-- Botón para descargar PDF -->
            <button id="btnDescargarPDF" class="hidden bg-white text-blue-600 hover:bg-blue-50 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                <i class="ph ph-file-pdf text-xl"></i>
                Descargar PDF
            </button>
        </div>

        <div class="p-6">
            <!-- Formulario -->
            <form id="cotizadorForm" class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">SKU</label>
                        <input type="text" id="inputSku" placeholder="Ej: PRD-01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Producto <span class="text-red-500">*</span></label>
                        <input type="text" id="inputNombre" placeholder="Laptop Dell XPS 15" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL Imagen (Opcional)</label>
                        <input type="url" id="inputImagen" placeholder="https://ejemplo.com/img.jpg" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Unitario (Bs) <span class="text-red-500">*</span></label>
                        <input type="number" id="inputPrecio" step="0.01" min="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>

                    <div class="lg:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad <span class="text-red-500">*</span></label>
                        <input type="number" id="inputCantidad" value="1" min="1" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>

                    <div class="lg:col-span-1 flex items-end">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <i class="ph ph-plus-circle text-xl"></i>
                            Agregar
                        </button>
                    </div>
                </div>
            </form>

            <!-- Contenedor de la Tabla -->
            <div class="overflow-x-auto rounded-xl border border-gray-200">
                <table id="tablaCotizacion" class="w-full text-left border-collapse hidden">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                            <th class="p-4 font-medium w-24 text-center">Img</th>
                            <th class="p-4 font-medium">SKU</th>
                            <th class="p-4 font-medium">Nombre</th>
                            <th class="p-4 font-medium text-right">Precio Un.</th>
                            <th class="p-4 font-medium text-center">Cant.</th>
                            <th class="p-4 font-medium text-right">Subtotal</th>
                            <th class="p-4 font-medium text-center w-16">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody" class="divide-y divide-gray-200 bg-white">
                        <!-- Las filas se insertarán aquí dinámicamente -->
                    </tbody>
                </table>

                <!-- Mensaje de estado vacío -->
                <div id="estadoVacio" class="py-12 text-center text-gray-500 bg-white">
                    <i class="ph ph-shopping-cart text-5xl mb-3 text-gray-300"></i>
                    <p>No hay productos en la cotización.</p>
                </div>
            </div>

            <!-- Resumen de Totales -->
            <div id="resumenTotales" class="hidden mt-6 bg-gray-50 p-6 rounded-xl border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-gray-600">
                    Total de artículos: <span id="txtTotalItems" class="font-bold text-gray-900">0</span>
                </div>
                <div class="text-xl text-gray-600">
                    Total: <span id="txtTotalGeneral" class="text-3xl font-bold text-blue-600">Bs 0.00</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Variables de estado
            let items = [];

            // Referencias del DOM
            const form = document.getElementById('cotizadorForm');
            const btnDescargarPDF = document.getElementById('btnDescargarPDF');
            const tablaCotizacion = document.getElementById('tablaCotizacion');
            const tablaBody = document.getElementById('tablaBody');
            const estadoVacio = document.getElementById('estadoVacio');
            const resumenTotales = document.getElementById('resumenTotales');
            const txtTotalItems = document.getElementById('txtTotalItems');
            const txtTotalGeneral = document.getElementById('txtTotalGeneral');

            // Formateador de moneda
            const formatCurrency = (amount) => {
                return 'Bs ' + parseFloat(amount).toFixed(2);
            };

            // Función auxiliar para convertir URL de imagen a Data URL (base64)
            const getDataUrl = (url) => {
                return new Promise((resolve, reject) => {
                    if (!url) {
                        resolve(null);
                        return;
                    }
                    const img = new Image();
                    // Importante para imágenes de otros dominios
                    img.crossOrigin = 'Anonymous';
                    img.src = url;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        // Convertir a formato JPEG para el PDF
                        resolve(canvas.toDataURL('image/jpeg')); 
                    };
                    img.onerror = (error) => {
                        console.warn(`No se pudo cargar la imagen: ${url}`);
                        resolve(null); // Resolver con null para no romper el flujo
                    };
                });
            };

            // Evento de Envío de Formulario
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const skuIngresado = document.getElementById('inputSku').value.trim();
                const cantidadIngresada = parseInt(document.getElementById('inputCantidad').value);
                
                // Verificar si ya existe el SKU (y que no esté vacío)
                if (skuIngresado !== '') {
                    const itemExistente = items.find(item => item.sku === skuIngresado);
                    if (itemExistente) {
                        itemExistente.cantidad += cantidadIngresada;
                        
                        // Limpiar formulario y mantener foco
                        form.reset();
                        document.getElementById('inputCantidad').value = 1;
                        document.getElementById('inputSku').focus();
                        
                        renderizarTabla();
                        return; // Terminar aquí para no agregar un duplicado a la lista
                    }
                }

                const nuevoItem = {
                    id: Date.now().toString(),
                    sku: skuIngresado || '-',
                    nombre: document.getElementById('inputNombre').value.trim(),
                    imagen: document.getElementById('inputImagen').value.trim(),
                    precio: parseFloat(document.getElementById('inputPrecio').value),
                    cantidad: cantidadIngresada
                };

                items.push(nuevoItem);
                
                // Limpiar formulario y mantener foco en el nombre
                form.reset();
                document.getElementById('inputCantidad').value = 1;
                document.getElementById('inputSku').focus();

                renderizarTabla();
            });

            // Función para eliminar
            window.eliminarItem = (id) => {
                items = items.filter(item => item.id !== id);
                renderizarTabla();
            };

            // Funciones para actualizar desde la tabla (Carrito)
            window.actualizarCantidad = (id, nuevaCantidad) => {
                const item = items.find(i => i.id === id);
                if (item) {
                    item.cantidad = parseInt(nuevaCantidad) || 1;
                    if (item.cantidad < 1) item.cantidad = 1;
                    renderizarTabla();
                }
            };

            window.actualizarPrecio = (id, nuevoPrecio) => {
                const item = items.find(i => i.id === id);
                if (item) {
                    item.precio = parseFloat(nuevoPrecio) || 0;
                    if (item.precio < 0.01) item.precio = 0.01;
                    renderizarTabla();
                }
            };

            // Función Principal de Renderizado
            const renderizarTabla = () => {
                tablaBody.innerHTML = '';
                let cantidadTotal = 0;
                let subtotalGeneral = 0;

                if (items.length === 0) {
                    tablaCotizacion.classList.add('hidden');
                    resumenTotales.classList.add('hidden');
                    btnDescargarPDF.classList.add('hidden');
                    estadoVacio.classList.remove('hidden');
                    return;
                }

                tablaCotizacion.classList.remove('hidden');
                resumenTotales.classList.remove('hidden');
                btnDescargarPDF.classList.remove('hidden');
                estadoVacio.classList.add('hidden');

                items.forEach(item => {
                    const subtotalLinea = item.precio * item.cantidad;
                    cantidadTotal += item.cantidad;
                    subtotalGeneral += subtotalLinea;

                    // Manejo de la imagen grande 80x80 (w-20 h-20)
                    const imgHtml = item.imagen 
                        ? `<img src="${item.imagen}" alt="${item.nombre}" class="w-20 h-20 object-cover rounded-md border border-gray-200 bg-gray-50 shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/80x80/f3f4f6/9ca3af?text=Img';">`
                        : `<div class="w-20 h-20 bg-gray-100 rounded-md border border-gray-200 flex items-center justify-center text-gray-400 mx-auto shadow-sm"><i class="ph ph-image text-2xl"></i></div>`;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50/50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-3 text-center align-middle"><div class="flex justify-center">${imgHtml}</div></td>
                        <td class="p-3 text-sm text-gray-600">${item.sku}</td>
                        <td class="p-3 text-sm font-medium text-gray-900">${item.nombre}</td>
                        <td class="p-3 text-sm text-right">
                            <div class="flex items-center justify-end gap-1">
                                <span class="text-gray-500 font-medium">Bs</span>
                                <input type="number" step="0.01" min="0.01" value="${item.precio}" onchange="actualizarPrecio('${item.id}', this.value)" class="w-20 px-2 py-1 text-right border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white transition-all">
                            </div>
                        </td>
                        <td class="p-3 text-sm text-center">
                            <input type="number" min="1" value="${item.cantidad}" onchange="actualizarCantidad('${item.id}', this.value)" class="w-16 px-2 py-1 text-center border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white transition-all">
                        </td>
                        <td class="p-3 text-sm text-right font-bold text-gray-900">${formatCurrency(subtotalLinea)}</td>
                        <td class="p-3 text-center">
                            <button onclick="eliminarItem('${item.id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors" title="Eliminar">
                                <i class="ph ph-trash text-xl"></i>
                            </button>
                        </td>
                    `;
                    tablaBody.appendChild(tr);
                });

                txtTotalItems.textContent = cantidadTotal;
                txtTotalGeneral.textContent = formatCurrency(subtotalGeneral);
            };

            // ==========================================
            // LÓGICA PARA GENERAR PDF NATIVO (jsPDF)
            // ==========================================
            btnDescargarPDF.addEventListener('click', async () => {
                // Cambiar el texto del botón para indicar carga
                const btnTextoOriginal = btnDescargarPDF.innerHTML;
                btnDescargarPDF.innerHTML = '<i class="ph ph-spinner gap-2 animate-spin text-xl"></i> Generando PDF...';
                btnDescargarPDF.disabled = true;

                try {
                    // 1. Inicializar jsPDF
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    // 2. Configurar metadatos y título del documento
                    const fecha = new Date().toLocaleDateString('es-ES');
                    
                    doc.setFontSize(22);
                    doc.setTextColor(37, 99, 235); // Color azul (Tailwind blue-600)
                    doc.text("Cotización de Productos", 14, 22);
                    
                    doc.setFontSize(11);
                    doc.setTextColor(100, 100, 100);
                    doc.text(`Fecha de emisión: ${fecha}`, 14, 30);

                    // 3. Preparar los datos y cargar imágenes
                    const columnas = ["Img", "SKU", "Descripción", "Precio Unitario", "Cantidad", "Subtotal"];
                    const filas = [];
                    let totalSuma = 0;
                    const itemsConImagenes = [];

                    // Procesar cada item y cargar su imagen si existe
                    for (const item of items) {
                        const subtotal = item.precio * item.cantidad;
                        totalSuma += subtotal;

                        // Obtener la imagen en formato base64
                        const imgDataUrl = await getDataUrl(item.imagen);
                        itemsConImagenes.push({ ...item, imgDataUrl });

                        filas.push([
                            '', // Placeholder para la columna de imagen
                            item.sku,
                            item.nombre,
                            formatCurrency(item.precio),
                            item.cantidad.toString(),
                            formatCurrency(subtotal)
                        ]);
                    }

                    // 4. Dibujar la tabla de forma nativa con imágenes
                    doc.autoTable({
                        startY: 38,
                        head: [columnas],
                        body: filas,
                        theme: 'striped',
                        headStyles: { 
                            fillColor: [37, 99, 235], // Azul
                            textColor: [255, 255, 255],
                            fontStyle: 'bold',
                            halign: 'center'
                        },
                        styles: { 
                            fontSize: 10,
                            cellPadding: 4,
                            valign: 'middle'
                        },
                        columnStyles: {
                            0: { cellWidth: 25, halign: 'center' }, // Img
                            1: { cellWidth: 30 }, // SKU
                            2: { cellWidth: 'auto' }, // Nombre
                            3: { halign: 'right', cellWidth: 30 }, // Precio Un.
                            4: { halign: 'center', cellWidth: 20 }, // Cantidad
                            5: { halign: 'right', cellWidth: 30 } // Subtotal
                        },
                        // Hook para dibujar la imagen en la celda correspondiente
                        didDrawCell: (data) => {
                            // Si es la primera columna (índice 0) y es una celda del cuerpo de la tabla
                            if (data.column.index === 0 && data.cell.section === 'body') {
                                const item = itemsConImagenes[data.row.index];
                                if (item && item.imgDataUrl) {
                                    // Ajustar el tamaño y posición de la imagen dentro de la celda
                                    const imgSize = 15; // Tamaño de la imagen en el PDF
                                    const x = data.cell.x + (data.cell.width - imgSize) / 2;
                                    const y = data.cell.y + (data.cell.height - imgSize) / 2;
                                    doc.addImage(item.imgDataUrl, 'JPEG', x, y, imgSize, imgSize);
                                }
                            }
                        },
                        // Añadir el pie de página con el Total
                        foot: [[
                            { content: 'TOTAL GENERAL:', colSpan: 5, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240], textColor: [0,0,0] } },
                            { content: formatCurrency(totalSuma), styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240], textColor: [37, 99, 235] } }
                        ]]
                    });

                    // 5. Descargar el archivo PDF
                    doc.save(`Cotizacion_${Date.now()}.pdf`);
                } catch (error) {
                    console.error("Error al generar el PDF:", error);
                    alert("Hubo un problema al generar el PDF. Por favor, intenta nuevamente.");
                } finally {
                    // Restaurar el botón a su estado original
                    btnDescargarPDF.innerHTML = btnTextoOriginal;
                    btnDescargarPDF.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
