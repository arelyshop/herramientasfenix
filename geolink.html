<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLink - Navegación</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --geo-color: #16a34a;
            --geo-hover: #15803d;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            text-align: center;
        }

        .icon-container {
            background-color: #dcfce7;
            color: var(--geo-color);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #f8fafc;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--geo-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: var(--geo-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);
        }

        button:hover {
            background-color: var(--geo-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Estilos para el mensaje de notificación (Toast) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--error-color);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 50;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>
        
        <h2>Ir al Destino</h2>
        <p class="subtitle">Ingresa las coordenadas y selecciona tu app de mapas preferida.</p>

        <div class="input-group">
            <input type="text" id="destino" placeholder="-17.7833, -63.1821" autocomplete="off">
        </div>

        <button onclick="abrirNavegacion()">
            Abrir Navegación
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div id="toast"></div>

    <script>
        let toastTimeout;

        function mostrarMensaje(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.classList.add('show');
            
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function abrirNavegacion() {
            // Obtenemos el valor y quitamos espacios en blanco
            let destino = document.getElementById('destino').value.trim();
            destino = destino.replace(/\s+/g, '');

            if (!destino) {
                mostrarMensaje('Por favor, ingresa las coordenadas de destino.');
                return;
            }

            // Validar de forma básica que parece una coordenada (contiene una coma)
            if (!destino.includes(',')) {
                mostrarMensaje('Formato inválido. Usa latitud, longitud (Ej: -17.78, -63.18)');
                return;
            }

            // Generamos el GeoLink
            // Al usar q=lat,lng nos aseguramos de que la app ponga un pin exacto
            const geoUrl = `geo:${destino}?q=${destino}`;
            
            // Redirigimos a la app
            window.location.href = geoUrl;
        }
    </script>
</body>
</html>
