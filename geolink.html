<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLink - Navegación</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --geo-color: #16a34a;
            --geo-hover: #15803d;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .icon-container {
            background-color: #dcfce7;
            color: var(--geo-color);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.875rem;
            padding-right: 3.5rem; /* Espacio para el botón de pegar */
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #f8fafc;
            text-overflow: ellipsis;
        }

        input:focus {
            outline: none;
            border-color: var(--geo-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        .btn-paste {
            position: absolute;
            right: 0.35rem;
            background: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 6px;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
            margin: 0;
        }

        .btn-paste:hover {
            background: #cbd5e1;
            color: #1e293b;
        }

        .btn-main {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: var(--geo-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);
        }

        .btn-main:hover {
            background-color: var(--geo-hover);
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-main:disabled {
            cursor: not-allowed;
            opacity: 0.8;
            transform: none;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--error-color);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 50;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>
        
        <h2>Ir al Destino</h2>
        <p class="subtitle">Pega tus coordenadas o un enlace de Google Maps.</p>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="destino" placeholder="Ej: https://maps.app..." autocomplete="off">
                <button class="btn-paste" onclick="pegarTexto()" title="Pegar del portapapeles">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
        </div>

        <button id="btn-nav" class="btn-main" onclick="abrirNavegacion()">
            <span class="spinner" id="spinner"></span>
            <span id="btn-text">Abrir Navegación</span>
            <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div id="toast"></div>

    <script>
        let toastTimeout;

        function mostrarMensaje(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.classList.add('show');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Función para el botón de pegar
        async function pegarTexto() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('destino').value = text;
                }
            } catch (err) {
                mostrarMensaje('Permiso denegado o no compatible. Pega manualmente (Ctrl+V).');
            }
        }

        function extraerCoordenadas(texto) {
            if (!texto) return null;
            texto = decodeURIComponent(texto);

            // 1. Patrón genérico: Coordenadas puras exactas al inicio (Ej: -17.78, -63.18)
            let match = texto.match(/^(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)$/);
            if (match) return `${match[1]},${match[2]}`;

            // 2. Buscar @lat,lng (Formato web clásico)
            match = texto.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
            if (match) return `${match[1]},${match[2]}`;

            // 3. Buscar ll=lat,lng o q=lat,lng o center=lat,lng
            match = texto.match(/[?&](?:q|ll|center)=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
            if (match) return `${match[1]},${match[2]}`;

            // 4. Buscar variables internas de google (arreglos ocultos)
            match = texto.match(/\[null,null,(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)\]/);
            if (match) return `${match[1]},${match[2]}`;
            
            // 5. Coordenadas sueltas en cualquier parte del texto (fallback extremo para HTML)
            match = texto.match(/(-?\d{1,2}\.\d{4,})[,\s]+(-?\d{1,3}\.\d{4,})/);
            if (match) return `${match[1]},${match[2]}`;

            return null;
        }

        async function resolverEnlaceCorto(url) {
            // Usamos dos servicios distintos por si uno falla o está bloqueado
            const proxies = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const proxyUrl of proxies) {
                try {
                    // Creamos un controlador para abortar la petición si tarda más de 5 segundos
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(proxyUrl, { signal: controller.signal });
                    clearTimeout(timeoutId); // Limpiar timeout si responde a tiempo

                    let textoAnalizar = '';
                    
                    if (proxyUrl.includes('allorigins')) {
                        const data = await response.json();
                        // Unimos el HTML y la URL final (por si resolvió la redirección)
                        textoAnalizar = (data.contents || '') + ' ' + (data.status?.url || '');
                    } else {
                        textoAnalizar = await response.text();
                    }

                    // Intentar extraer del texto crudo
                    const coords = extraerCoordenadas(textoAnalizar);
                    if (coords) return coords; // Si encontró, cortamos el ciclo y retornamos

                } catch (e) {
                    console.log('Intento de proxy fallido, pasando al siguiente...', e);
                }
            }
            
            return null; // Retorna null si ambos proxys fallaron o no encontraron nada
        }

        async function abrirNavegacion() {
            let input = document.getElementById('destino').value.trim();
            const btn = document.getElementById('btn-nav');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');

            if (!input) {
                mostrarMensaje('Por favor, ingresa coordenadas o un enlace.');
                return;
            }

            let destino = null;

            // UI: Bloquear botón e iniciar animación
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnIcon.style.display = 'none';

            try {
                // Detectar si es un enlace acortado
                if (input.includes('goo.gl') || input.includes('maps.app.goo.gl')) {
                    btnText.textContent = 'Extrayendo...';
                    destino = await resolverEnlaceCorto(input);
                } else {
                    btnText.textContent = 'Procesando...';
                    destino = extraerCoordenadas(input);
                }

                if (!destino) {
                    mostrarMensaje('No se detectaron coordenadas válidas en este enlace.');
                    return;
                }

                // Generar y ejecutar el enlace nativo
                const geoUrl = `geo:${destino}?q=${destino}`;
                window.location.href = geoUrl;

            } catch (error) {
                mostrarMensaje('Ocurrió un error al procesar la solicitud.');
                console.error(error);
            } finally {
                // UI: SIEMPRE Restaurar el botón original (incluso si falla)
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Abrir Navegación';
                btnIcon.style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
