<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLink - Navegación</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --geo-color: #16a34a;
            --geo-hover: #15803d;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            text-align: center;
        }

        .icon-container {
            background-color: #dcfce7;
            color: var(--geo-color);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #f8fafc;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--geo-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: var(--geo-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.2);
        }

        button:hover {
            background-color: var(--geo-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Estilos para el mensaje de notificación (Toast) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--error-color);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 50;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>
        
        <h2>Ir al Destino</h2>
        <p class="subtitle">Ingresa coordenadas o <strong>pega un enlace de Maps</strong> para abrir en tu app preferida.</p>

        <div class="input-group">
            <input type="text" id="destino" placeholder="Ej: -17.78, -63.18 o https://maps..." autocomplete="off">
        </div>

        <button id="btn-nav" onclick="abrirNavegacion()">
            <span class="spinner" id="spinner"></span>
            <span id="btn-text">Abrir Navegación</span>
            <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div id="toast"></div>

    <script>
        let toastTimeout;

        function mostrarMensaje(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.classList.add('show');
            
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function extraerCoordenadas(texto) {
            // 1. Buscar Formato de Google Maps /@lat,lng (común en links de navegador)
            let match = texto.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (match) return `${match[1]},${match[2]}`;

            // 2. Buscar Parámetros q= o ll= (común en URLs de búsqueda)
            match = texto.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (match) return `${match[1]},${match[2]}`;

            // 3. Patrón genérico: Coordenadas puras (ej. -17.783, -63.182)
            match = texto.match(/(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/);
            if (match) return `${match[1]},${match[2]}`;

            return null; // No se encontró nada que parezcan coordenadas
        }

        async function resolverEnlaceCorto(url) {
            try {
                // Usamos un proxy público (AllOrigins) para evitar bloqueos de seguridad y poder leer el HTML real
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data && data.contents) {
                    const html = data.contents;
                    
                    // 1. Buscar la URL canónica real (og:url) dentro del código de la web final
                    let match = html.match(/<meta property="og:url" content="([^"]+)"/);
                    if (match && match[1]) {
                        const coords = extraerCoordenadas(match[1]);
                        if (coords) return coords;
                    }

                    // 2. Buscar en la imagen estática de previsualización (frecuente en app.goo.gl)
                    match = html.match(/center=(-?\d+\.\d+)%2C(-?\d+\.\d+)/); // %2C es la coma codificada
                    if (match) return `${match[1]},${match[2]}`;
                    
                    // 3. Buscar cualquier coincidencia pura de coordenadas en el código
                    match = html.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                    if (match) return `${match[1]},${match[2]}`;
                }
                return null;
            } catch (error) {
                console.error("Error al resolver URL:", error);
                return null;
            }
        }

        async function abrirNavegacion() {
            let input = document.getElementById('destino').value.trim();
            const btn = document.getElementById('btn-nav');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');

            if (!input) {
                mostrarMensaje('Por favor, ingresa un enlace o coordenadas.');
                return;
            }

            let destino = null;

            // Detectar si es un enlace acortado
            if (input.includes('maps.app.goo.gl') || input.includes('goo.gl/maps')) {
                // UI: Iniciar animación de carga
                btn.disabled = true;
                spinner.style.display = 'inline-block';
                btnText.textContent = 'Extrayendo coordenadas...';
                btnIcon.style.display = 'none';

                // Llamar al proxy (tarda aprox 1-2 segundos)
                destino = await resolverEnlaceCorto(input);

                // UI: Restaurar el botón original
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Abrir Navegación';
                btnIcon.style.display = 'inline-block';
            } else {
                // Extracción inmediata si son coordenadas o un enlace completo ya revelado
                destino = extraerCoordenadas(input);
            }

            if (!destino) {
                mostrarMensaje('No pudimos detectar coordenadas válidas en este enlace.');
                return;
            }

            // Generamos el enlace nativo e invocamos el GPS (Waze, Maps, etc.)
            const geoUrl = `geo:${destino}?q=${destino}`;
            window.location.href = geoUrl;
        }
    </script>
</body>
</html>
