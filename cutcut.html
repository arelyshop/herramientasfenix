<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ArelyShop Studio — Recortador 1500x1500 y 1125x1500</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --snap: #10b981;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    header {
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 0.98rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 600;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 16px 24px;
      gap: 12px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* Selector de formato (2 paneles) */
    .format-tabs {
      width: 100%;
      max-width: 460px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--panel);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .format-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .format-tab span {
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.85;
    }

    .format-tab.active {
      background: #232836;
      border-color: var(--accent);
      color: #fff;
    }

    /* Contenedor del lienzo para mantener altura cómoda en móvil */
    .stage-wrapper {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .workspace {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 440px;
      background: #14171f;
      background-image:
        linear-gradient(45deg, #1c202b 25%, transparent 25%),
        linear-gradient(-45deg, #1c202b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1c202b 75%),
        linear-gradient(-45deg, transparent 75%, #1c202b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border: 2px dashed var(--border);
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .workspace.vertical {
      aspect-ratio: 3 / 4;
      width: auto;
      height: 440px;
      max-width: 100%;
    }

    .workspace.dragover {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
    }

    .workspace.has-image {
      border-style: solid;
      border-color: var(--border);
      cursor: grab;
    }

    .workspace.has-image:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .drop-prompt {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 10px;
      background: rgba(15, 17, 21, 0.78);
      backdrop-filter: blur(4px);
    }

    .drop-prompt.hidden {
      display: none;
    }

    .drop-prompt p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text);
    }

    .drop-prompt small {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .upload-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    /* Panel de controles */
    .controls {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row label {
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 42px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
      cursor: pointer;
    }

    .btn-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button, .file-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #222631;
      color: var(--text);
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
      user-select: none;
    }

    button:hover, .file-btn:hover {
      background: #2b303e;
    }

    button:active, .file-btn:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.42;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-toggle.active {
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--snap);
      color: #6ee7b7;
    }

    /* Desplazador de precisión px a px */
    .nudge-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #13161c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      gap: 8px;
    }

    .nudge-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nudge-title {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
    }

    .coords-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: #a5b4fc;
    }

    .step-toggle {
      display: inline-flex;
      background: #1e222d;
      border-radius: 7px;
      padding: 2px;
      border: 1px solid var(--border);
      width: fit-content;
    }

    .step-btn {
      padding: 3px 8px;
      font-size: 0.7rem;
      border: none;
      background: transparent;
      border-radius: 5px;
      color: var(--muted);
    }

    .step-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(2, 34px);
      gap: 4px;
    }

    .dpad button {
      padding: 0;
      font-size: 1rem;
      line-height: 1;
      border-radius: 7px;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    .bg-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .swatches {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      padding: 0;
    }

    .swatch.active {
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .download-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1f2937;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 50;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>ArelyShop Crop Studio</h1>
    <span class="badge" id="dimBadge">1500 × 1500 px</span>
  </header>

  <main>
    <!-- Selector de 2 paneles -->
    <div class="format-tabs" role="tablist">
      <button type="button" class="format-tab active" data-w="1500" data-h="1500" id="tabSquare">
        Cuadrado (1:1)
        <span>1500 × 1500 px</span>
      </button>
      <button type="button" class="format-tab" data-w="1125" data-h="1500" id="tabVertical">
        Vertical (3:4)
        <span>1125 × 1500 px</span>
      </button>
    </div>

    <div class="stage-wrapper">
      <div class="workspace" id="workspace">
        <canvas id="previewCanvas" width="900" height="900"></canvas>

        <div class="drop-prompt" id="dropPrompt">
          <p><strong>Arrastra y suelta tu imagen aquí</strong></p>
          <small>Pega con <b>Ctrl+V</b> o selecciona desde tu galería</small>
          <div class="upload-actions">
            <label class="file-btn btn-primary">
              Subir imagen
              <input type="file" id="fileInput" accept="image/*" hidden />
            </label>
            <button type="button" id="pasteBtn">Pegar imagen</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="slider-row">
        <label for="zoomSlider">Zoom</label>
        <input type="range" id="zoomSlider" min="0.1" max="5" step="0.005" value="1" disabled />
        <span id="zoomLabel" style="font-size:0.78rem; min-width:42px; text-align:right;">100%</span>
      </div>

      <div class="btn-grid-3">
        <button type="button" id="fillBtn" disabled title="Rellenar pantalla completa sin espacios">
          Rellenar todo
        </button>
        <button type="button" id="fitBtn" disabled title="Encajar imagen completa dentro del cuadro">
          Ajustar dentro
        </button>
        <button type="button" id="snapToggle" class="btn-toggle active" title="Imán inteligente a los bordes y centro">
          Imán: ON
        </button>
      </div>

      <!-- Desplazador de precisión px a px -->
      <div class="nudge-box">
        <div class="nudge-info">
          <span class="nudge-title">Mover precisión (flechas):</span>
          <div class="step-toggle">
            <button type="button" class="step-btn active" data-step="1" id="step1Btn">1 px</button>
            <button type="button" class="step-btn" data-step="10" id="step10Btn">10 px</button>
          </div>
          <span class="coords-readout" id="coordsReadout">X: 0 px | Y: 0 px</span>
        </div>

        <div class="dpad">
          <button type="button" class="dpad-up" data-dx="0" data-dy="-1" disabled aria-label="Mover arriba">▲</button>
          <button type="button" class="dpad-left" data-dx="-1" data-dy="0" disabled aria-label="Mover izquierda">◀</button>
          <button type="button" class="dpad-down" data-dx="0" data-dy="1" disabled aria-label="Mover abajo">▼</button>
          <button type="button" class="dpad-right" data-dx="1" data-dy="0" disabled aria-label="Mover derecha">▶</button>
        </div>
      </div>

      <div class="bg-picker">
        <span>Fondo:</span>
        <div class="swatches">
          <button type="button" class="swatch active" data-bg="#ffffff" style="background:#ffffff" title="Blanco"></button>
          <button type="button" class="swatch" data-bg="#000000" style="background:#000000" title="Negro"></button>
          <button type="button" class="swatch" data-bg="transparent" style="background:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%);background-size:8px 8px;" title="Transparente (solo WebP)"></button>
          <label class="file-btn" style="padding:5px 9px; font-size:0.75rem;">
            Cambiar foto
            <input type="file" id="replaceInput" accept="image/*" hidden />
          </label>
        </div>
      </div>

      <div class="download-row">
        <button type="button" id="dlWebp" class="btn-primary" disabled>
          WebP (Sin pérdida)
        </button>
        <button type="button" id="dlJpg" disabled>
          JPG (Máx. calidad)
        </button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let outputW = 1500;
    let outputH = 1500;
    let previewW = 900;
    let previewH = 900;
    const SNAP_THRESHOLD = 14;

    const workspace = document.getElementById('workspace');
    const dropPrompt = document.getElementById('dropPrompt');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const dimBadge = document.getElementById('dimBadge');

    const fileInput = document.getElementById('fileInput');
    const replaceInput = document.getElementById('replaceInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const fillBtn = document.getElementById('fillBtn');
    const fitBtn = document.getElementById('fitBtn');
    const snapToggle = document.getElementById('snapToggle');
    const dlWebp = document.getElementById('dlWebp');
    const dlJpg = document.getElementById('dlJpg');
    const coordsReadout = document.getElementById('coordsReadout');
    const dpadButtons = document.querySelectorAll('.dpad button');
    const toast = document.getElementById('toast');

    let img = null;
    // Coordenadas guardadas en píxeles reales de salida (1500x1500 o 1125x1500)
    let imgX = 0;
    let imgY = 0;
    let scale = 1; // escala relativa a outputW/outputH
    let baseCoverScale = 1;
    let snapEnabled = true;
    let bgColor = '#ffffff';
    let nudgeStep = 1;

    let activeGuides = { vCenter: false, hCenter: false, left: false, right: false, top: false, bottom: false };

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function updateCoordsReadout() {
      coordsReadout.textContent = `X: ${Math.round(imgX)} px | Y: ${Math.round(imgY)} px`;
    }

    // Cambio entre panel 1500x1500 y 1125x1500
    document.querySelectorAll('.format-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.format-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        outputW = parseInt(tab.dataset.w, 10);
        outputH = parseInt(tab.dataset.h, 10);
        previewH = 900;
        previewW = Math.round(900 * (outputW / outputH));

        canvas.width = previewW;
        canvas.height = previewH;
        workspace.classList.toggle('vertical', outputW !== outputH);
        dimBadge.textContent = `${outputW} × ${outputH} px`;

        if (img) {
          fillCanvas();
        } else {
          render();
        }
      });
    });

    function loadImageFromBlob(blob) {
      if (!blob || !blob.type.startsWith('image/')) {
        showToast('Por favor selecciona una imagen válida.');
        return;
      }
      const url = URL.createObjectURL(blob);
      const image = new Image();
      image.onload = () => {
        img = image;
        dropPrompt.classList.add('hidden');
        workspace.classList.add('has-image');

        zoomSlider.disabled = false;
        fillBtn.disabled = false;
        fitBtn.disabled = false;
        dlWebp.disabled = false;
        dlJpg.disabled = false;
        dpadButtons.forEach(b => b.disabled = false);

        fillCanvas();
        URL.revokeObjectURL(url);
      };
      image.src = url;
    }

    // Rellenar pantalla completa sin espacios vacíos
    function fillCanvas() {
      if (!img) return;
      baseCoverScale = Math.max(outputW / img.width, outputH / img.height);
      scale = baseCoverScale;
      imgX = (outputW - img.width * scale) / 2;
      imgY = (outputH - img.height * scale) / 2;
      syncSlider();
      clearGuides();
      render();
    }

    // Encajar imagen completa dentro del cuadro
    function fitCanvas() {
      if (!img) return;
      const fitScale = Math.min(outputW / img.width, outputH / img.height);
      scale = fitScale;
      imgX = (outputW - img.width * scale) / 2;
      imgY = (outputH - img.height * scale) / 2;
      syncSlider();
      clearGuides();
      render();
    }

    function syncSlider() {
      const minS = Math.min(outputW / img.width, outputH / img.height) * 0.4;
      const maxS = Math.max(baseCoverScale * 4, 3);
      zoomSlider.min = minS.toFixed(4);
      zoomSlider.max = maxS.toFixed(4);
      zoomSlider.value = scale;
      zoomLabel.textContent = Math.round((scale / baseCoverScale) * 100) + '%';
    }

    function clearGuides() {
      activeGuides = { vCenter: false, hCenter: false, left: false, right: false, top: false, bottom: false };
    }

    // Imán magnético en espacio de salida (1500 / 1125 px)
    function applySnapping(x, y, w, h) {
      clearGuides();
      if (!snapEnabled) return { x, y };

      const thresh = SNAP_THRESHOLD * (outputH / previewH);
      let snappedX = x;
      let snappedY = y;

      if (Math.abs(x) < thresh) {
        snappedX = 0;
        activeGuides.left = true;
      } else if (Math.abs((x + w) - outputW) < thresh) {
        snappedX = outputW - w;
        activeGuides.right = true;
      } else if (Math.abs((x + w / 2) - outputW / 2) < thresh) {
        snappedX = (outputW - w) / 2;
        activeGuides.vCenter = true;
      }

      if (Math.abs(y) < thresh) {
        snappedY = 0;
        activeGuides.top = true;
      } else if (Math.abs((y + h) - outputH) < thresh) {
        snappedY = outputH - h;
        activeGuides.bottom = true;
      } else if (Math.abs((y + h / 2) - outputH / 2) < thresh) {
        snappedY = (outputH - h) / 2;
        activeGuides.hCenter = true;
      }

      return { x: snappedX, y: snappedY };
    }

    function render() {
      ctx.clearRect(0, 0, previewW, previewH);

      if (bgColor !== 'transparent') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, previewW, previewH);
      }

      if (!img) return;

      const pRatio = previewH / outputH;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(
        img,
        imgX * pRatio,
        imgY * pRatio,
        img.width * scale * pRatio,
        img.height * scale * pRatio
      );

      updateCoordsReadout();

      // Guías visuales de alineación magnética
      ctx.save();
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 3;

      if (activeGuides.vCenter) {
        ctx.beginPath();
        ctx.moveTo(previewW / 2, 0);
        ctx.lineTo(previewW / 2, previewH);
        ctx.stroke();
      }
      if (activeGuides.hCenter) {
        ctx.beginPath();
        ctx.moveTo(0, previewH / 2);
        ctx.lineTo(previewW, previewH / 2);
        ctx.stroke();
      }
      if (activeGuides.left) ctx.strokeRect(1.5, 1.5, 0, previewH - 3);
      if (activeGuides.right) ctx.strokeRect(previewW - 1.5, 1.5, 0, previewH - 3);
      if (activeGuides.top) ctx.strokeRect(1.5, 1.5, previewW - 3, 0);
      if (activeGuides.bottom) ctx.strokeRect(1.5, previewH - 1.5, previewW - 3, 0);
      ctx.restore();
    }

    // Desplazamiento exacto px a px (sin imán para control milimétrico)
    function nudgeImage(dx, dy) {
      if (!img) return;
      imgX = Math.round(imgX) + dx;
      imgY = Math.round(imgY) + dy;
      clearGuides();
      render();
    }

    // Selector de paso 1px / 10px
    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        nudgeStep = parseInt(btn.dataset.step, 10);
      });
    });

    // Botones de flecha con repetición continua al mantener presionado
    dpadButtons.forEach(btn => {
      let holdTimer = null;
      let holdInterval = null;

      const stepMove = () => {
        const dx = parseInt(btn.dataset.dx, 10) * nudgeStep;
        const dy = parseInt(btn.dataset.dy, 10) * nudgeStep;
        nudgeImage(dx, dy);
      };

      const startHold = (e) => {
        e.preventDefault();
        if (btn.disabled) return;
        stepMove();
        holdTimer = setTimeout(() => {
          holdInterval = setInterval(stepMove, 45);
        }, 320);
      };

      const stopHold = () => {
        clearTimeout(holdTimer);
        clearInterval(holdInterval);
      };

      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('touchstart', startHold, { passive: false });
      btn.addEventListener('mouseup', stopHold);
      btn.addEventListener('mouseleave', stopHold);
      btn.addEventListener('touchend', stopHold);
      btn.addEventListener('touchcancel', stopHold);
    });

    // Flechas del teclado físico (1 px normal, 10 px con Shift)
    window.addEventListener('keydown', (e) => {
      if (!img) return;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const mult = e.shiftKey ? 10 : nudgeStep;
        if (e.key === 'ArrowUp') nudgeImage(0, -mult);
        if (e.key === 'ArrowDown') nudgeImage(0, mult);
        if (e.key === 'ArrowLeft') nudgeImage(-mult, 0);
        if (e.key === 'ArrowRight') nudgeImage(mult, 0);
      }
    });

    // Zoom centrado
    function setZoomAt(newScale, centerX = outputW / 2, centerY = outputH / 2) {
      if (!img) return;
      const minS = parseFloat(zoomSlider.min);
      const maxS = parseFloat(zoomSlider.max);
      newScale = Math.max(minS, Math.min(maxS, newScale));

      const ratio = newScale / scale;
      let nextX = centerX - (centerX - imgX) * ratio;
      let nextY = centerY - (centerY - imgY) * ratio;
      scale = newScale;

      const snapped = applySnapping(nextX, nextY, img.width * scale, img.height * scale);
      imgX = snapped.x;
      imgY = snapped.y;

      zoomSlider.value = scale;
      zoomLabel.textContent = Math.round((scale / baseCoverScale) * 100) + '%';
      render();
    }

    // Eventos de ratón y gestos táctiles
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;

    function getOutputCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (outputW / rect.width),
        y: (clientY - rect.top) * (outputH / rect.height)
      };
    }

    workspace.addEventListener('mousedown', (e) => {
      if (!img) return;
      isDragging = true;
      const pt = getOutputCoords(e.clientX, e.clientY);
      startX = pt.x - imgX;
      startY = pt.y - imgY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !img) return;
      const pt = getOutputCoords(e.clientX, e.clientY);
      const snapped = applySnapping(pt.x - startX, pt.y - startY, img.width * scale, img.height * scale);
      imgX = snapped.x;
      imgY = snapped.y;
      render();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        clearGuides();
        render();
      }
    });

    workspace.addEventListener('wheel', (e) => {
      if (!img) return;
      e.preventDefault();
      const pt = getOutputCoords(e.clientX, e.clientY);
      const factor = e.deltaY < 0 ? 1.07 : 0.93;
      setZoomAt(scale * factor, pt.x, pt.y);
    }, { passive: false });

    workspace.addEventListener('touchstart', (e) => {
      if (!img) return;
      if (e.touches.length === 1) {
        isDragging = true;
        const pt = getOutputCoords(e.touches[0].clientX, e.touches[0].clientY);
        startX = pt.x - imgX;
        startY = pt.y - imgY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchScale = scale;
      }
    }, { passive: false });

    workspace.addEventListener('touchmove', (e) => {
      if (!img) return;
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        const pt = getOutputCoords(e.touches[0].clientX, e.touches[0].clientY);
        const snapped = applySnapping(pt.x - startX, pt.y - startY, img.width * scale, img.height * scale);
        imgX = snapped.x;
        imgY = snapped.y;
        render();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const pt = getOutputCoords(midX, midY);
        setZoomAt(initialPinchScale * (dist / initialPinchDist), pt.x, pt.y);
      }
    }, { passive: false });

    workspace.addEventListener('touchend', () => {
      isDragging = false;
      clearGuides();
      render();
    });

    // Drag & Drop
    ['dragenter', 'dragover'].forEach(evt => {
      workspace.addEventListener(evt, (e) => {
        e.preventDefault();
        workspace.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      workspace.addEventListener(evt, (e) => {
        e.preventDefault();
        workspace.classList.remove('dragover');
      });
    });

    workspace.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if (file) loadImageFromBlob(file);
    });

    // Copiar y Pegar
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          loadImageFromBlob(item.getAsFile());
          showToast('Imagen pegada desde el portapapeles');
          break;
        }
      }
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const clipboardItems = await navigator.clipboard.read();
        for (const item of clipboardItems) {
          const imgType = item.types.find(t => t.startsWith('image/'));
          if (imgType) {
            const blob = await item.getType(imgType);
            loadImageFromBlob(blob);
            showToast('Imagen pegada');
            return;
          }
        }
        showToast('No hay ninguna imagen copiada en el portapapeles.');
      } catch {
        showToast('Usa Ctrl+V (o mantén presionado y selecciona Pegar).');
      }
    });

    // Controles generales
    fileInput.addEventListener('change', (e) => loadImageFromBlob(e.target.files[0]));
    replaceInput.addEventListener('change', (e) => loadImageFromBlob(e.target.files[0]));
    zoomSlider.addEventListener('input', (e) => setZoomAt(parseFloat(e.target.value)));
    fillBtn.addEventListener('click', fillCanvas);
    fitBtn.addEventListener('click', fitCanvas);

    snapToggle.addEventListener('click', () => {
      snapEnabled = !snapEnabled;
      snapToggle.classList.toggle('active', snapEnabled);
      snapToggle.textContent = snapEnabled ? 'Imán: ON' : 'Imán: OFF';
    });

    document.querySelectorAll('.swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        bgColor = btn.dataset.bg;
        render();
      });
    });

    // Exportación exacta en el formato activo (1500x1500 o 1125x1500)
    function exportImage(format) {
      if (!img) return;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = outputW;
      outCanvas.height = outputH;
      const outCtx = outCanvas.getContext('2d');

      if (format === 'image/jpeg' || bgColor !== 'transparent') {
        outCtx.fillStyle = bgColor === 'transparent' ? '#ffffff' : bgColor;
        outCtx.fillRect(0, 0, outputW, outputH);
      }

      outCtx.imageSmoothingEnabled = true;
      outCtx.imageSmoothingQuality = 'high';
      outCtx.drawImage(
        img,
        imgX,
        imgY,
        img.width * scale,
        img.height * scale
      );

      const ext = format === 'image/webp' ? 'webp' : 'jpg';
      const timestamp = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 14);
      const filename = `arelyshop-photo-${timestamp}.${ext}`;

      outCanvas.toBlob((blob) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast(`Descargado (${outputW}×${outputH}): ${filename}`);
      }, format, 1.0);
    }

    dlWebp.addEventListener('click', () => exportImage('image/webp'));
    dlJpg.addEventListener('click', () => exportImage('image/jpeg'));
  </script>
</body>
</html>
