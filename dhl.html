<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Notas de Encomienda - Arelyshop</title>
    
    <!-- Favicon Personalizado con el icono solicitado -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960'%3E%3Cpath fill='%2387e64b' d='M440-183v-274L200-596v274l240 139Zm80 0 240-139v-274L520-457v274Zm-80 92L160-252q-19-11-29.5-29T120-321v-318q0-22 10.5-40t29.5-29l280-161q19-11 40-11t40 11l280 161q19 11 29.5 29t10.5 40v318q0 22-10.5 40T800-252L520-91q-19 11-40 11t-40-11Zm200-528 77-44-237-137-78 45 238 136Zm-160 93 78-45-237-137-78 45 237 137Z'/%3E%3C/svg%3E" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* CONFIGURACIÓN PARA IMPRESIÓN */
        @media print {
            @page {
                size: letter;
                margin: 0;
            }
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .no-print {
                display: none !important;
            }
            #printLayout {
                display: block !important;
                width: 215.9mm;
                height: 279.4mm;
            }
            .note-section {
                height: 33.33%;
                border-bottom: 1px dashed #000;
                padding: 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                page-break-inside: avoid;
            }
            .note-section:last-child {
                border-bottom: 1px dashed #000;
            }
            .inner-box {
                width: 85% !important;
            }
        }

        /* ESTILOS PARA PANTALLA */
        .preview-container {
            background-color: #f3f4f6;
            min-height: 100vh;
            padding: 20px;
        }
        .page-shadow {
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background: white;
            width: 215.9mm;
            height: 279.4mm;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        .note-preview {
            height: 33.33%;
            border-bottom: 1px dashed #ccc;
            padding: 1.5rem;
            position: relative;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        .inner-box {
            width: 85%;
            height: 100%;
        }
        input {
            text-transform: uppercase;
        }

        /* Estilo para el PDF */
        .pdf-section {
            height: 93.1mm; 
            width: 215.9mm;
            border-bottom: 1px dashed #000;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
        }

        /* Dropdown personalizado */
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 100;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .dropdown-content button {
            width: 100%;
            text-align: left;
            padding: 8px 16px;
            font-size: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        .dropdown-content button:hover {
            background-color: #f3f4f6;
        }
        .show { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans" onclick="closeAllDropdowns(event)">

    <!-- Interfaz de Usuario -->
    <div class="no-print max-w-5xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-900 uppercase tracking-tight">Arelyshop.com</h1>
            <p class="text-gray-600 font-medium">Gestión de Encomiendas Profesionales</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-blue-800">
            <div id="inputsContainer" class="space-y-6">
                <!-- Dinámico -->
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 border-t mt-8 pt-6">
                <div class="flex items-center gap-4">
                    <button onclick="addNote()" id="btnAdd" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-6 rounded-lg flex items-center gap-2 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        Añadir otra nota
                    </button>
                </div>

                <div class="flex gap-4">
                    <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full flex items-center gap-2 shadow-md transition-all">
                        Descargar PDF
                    </button>
                    <button onclick="window.print()" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-10 rounded-full flex items-center gap-2 shadow-md transition-all">
                        Imprimir Hoja
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-container flex justify-center py-10 no-print">
        <div class="page-shadow" id="printableArea"></div>
    </div>

    <div id="printLayout" class="hidden"></div>

    <script>
        let activeNotes = 1;
        const departamentos = ["LA PAZ", "SANTA CRUZ", "COCHABAMBA", "ORURO", "POTOSÍ", "TARIJA", "SUCRE", "BENI", "PANDO"];

        function createInputGroup(id) {
            const div = document.createElement('div');
            div.id = `group-${id}`;
            div.className = "p-4 bg-gray-50 rounded-lg border border-gray-200 relative animate-fade-in";
            
            let removeBtn = id > 0 ? `
                <button onclick="removeNote(${id})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            ` : '';

            div.innerHTML = `
                ${removeBtn}
                <div class="mb-3"><span class="bg-blue-800 text-white text-xs font-bold px-2 py-1 rounded">ENVÍO #${id + 1}</span></div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-tight">Nombre:</label>
                        <input type="text" id="name-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-tight">Celular:</label>
                        <input type="text" id="cel-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-tight">C.I.:</label>
                        <input type="text" id="ci-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div class="relative">
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-tight">Destino:</label>
                        <div class="flex">
                            <input type="text" id="dest-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded-l text-sm font-bold" oninput="updatePreview()">
                            <button onclick="toggleDropdown(event, ${id})" class="bg-gray-200 border border-gray-300 border-l-0 px-2 rounded-r hover:bg-gray-300">▼</button>
                        </div>
                        <div id="dropdown-${id}" class="dropdown-content">
                            ${departamentos.map(dep => `<button onclick="setDest(${id}, '${dep}')">${dep}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function toggleDropdown(e, id) {
            e.stopPropagation();
            closeAllDropdowns();
            document.getElementById(`dropdown-${id}`).classList.toggle("show");
        }

        function setDest(id, val) {
            const input = document.getElementById(`dest-${id}`);
            input.value = val;
            updatePreview();
            closeAllDropdowns();
        }

        function closeAllDropdowns(e) {
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }

        function renderInputs() {
            const container = document.getElementById('inputsContainer');
            const saved = [];
            
            for (let i = 0; i < 3; i++) {
                const n = document.getElementById(`name-${i}`)?.value;
                const c = document.getElementById(`cel-${i}`)?.value;
                const ci = document.getElementById(`ci-${i}`)?.value;
                const d = document.getElementById(`dest-${i}`)?.value;
                if (n !== undefined) saved.push({n, c, ci, d});
            }

            container.innerHTML = "";
            for (let i = 0; i < activeNotes; i++) {
                container.appendChild(createInputGroup(i));
                if (saved[i]) {
                    document.getElementById(`name-${i}`).value = saved[i].n;
                    document.getElementById(`cel-${i}`).value = saved[i].c;
                    document.getElementById(`ci-${i}`).value = saved[i].ci;
                    document.getElementById(`dest-${i}`).value = saved[i].d;
                }
            }
            updateControls();
        }

        function addNote() { if (activeNotes < 3) { activeNotes++; renderInputs(); updatePreview(); } }
        function removeNote(index) { if (activeNotes > 1) { activeNotes--; renderInputs(); updatePreview(); } }
        function updateControls() {
            document.getElementById('btnAdd').style.display = activeNotes >= 3 ? 'none' : 'flex';
        }

        function generateNoteHTML(nombre, cel, ci, destino, fecha) {
            // Reemplazo de campos vacíos por "N/A"
            const dispNombre = nombre.trim() || "N/A";
            const dispCel = cel.trim() || "N/A";
            const dispCi = ci.trim() || "N/A";
            const dispDest = destino.trim() || "N/A";

            return `
                <div class="note-preview">
                    <div class="inner-box border-4 border-blue-900 p-6 flex flex-col justify-between rounded-lg bg-white">
                        <div class="flex justify-between items-start">
                            <h2 class="text-2xl font-black text-blue-900 italic uppercase tracking-tighter">Arelyshop.com</h2>
                            <div class="text-right"><p class="text-[10px] font-bold text-gray-700 bg-gray-100 px-2 py-1 rounded uppercase">FECHA: ${fecha}</p></div>
                        </div>
                        <div class="space-y-4 my-2">
                            <div class="flex items-end gap-2">
                                <span class="font-bold text-base text-gray-700 uppercase min-w-[80px]">Nombre:</span>
                                <div class="border-b-2 border-dotted border-gray-400 flex-grow text-xl font-bold px-2 text-black uppercase truncate leading-tight">${dispNombre}</div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex items-end gap-2 flex-1">
                                    <span class="font-bold text-base text-gray-700 uppercase">CEL:</span>
                                    <div class="border-b-2 border-dotted border-gray-400 flex-grow text-xl font-bold px-2 text-black uppercase leading-tight">${dispCel}</div>
                                </div>
                                <div class="flex items-end gap-2 flex-1">
                                    <span class="font-bold text-base text-gray-700 uppercase">C.I.:</span>
                                    <div class="border-b-2 border-dotted border-gray-400 flex-grow text-xl font-bold px-2 text-black uppercase leading-tight">${dispCi}</div>
                                </div>
                            </div>
                            <div class="flex items-end gap-2">
                                <span class="font-bold text-base text-gray-700 uppercase min-w-[80px]">Destino:</span>
                                <div class="border-b-2 border-dotted border-gray-400 flex-grow text-3xl font-black text-blue-800 px-2 uppercase leading-none">${dispDest}</div>
                            </div>
                        </div>
                        <div class="text-center mt-2 border-t border-gray-100 pt-2"><p class="text-base font-bold text-blue-900 italic uppercase">¡Gracias por comprar en Arelyshop.com!</p></div>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const container = document.getElementById('printableArea');
            container.innerHTML = "";
            const fechaStr = new Date().toLocaleDateString('es-BO', {day: '2-digit', month: '2-digit', year: 'numeric'});
            for (let i = 0; i < activeNotes; i++) {
                const n = document.getElementById(`name-${i}`)?.value.toUpperCase() || "";
                const c = document.getElementById(`cel-${i}`)?.value.toUpperCase() || "";
                const ci = document.getElementById(`ci-${i}`)?.value.toUpperCase() || "";
                const d = document.getElementById(`dest-${i}`)?.value.toUpperCase() || "";
                container.innerHTML += generateNoteHTML(n, c, ci, d, fechaStr);
            }
            const printLayout = document.getElementById('printLayout');
            printLayout.innerHTML = container.innerHTML;
            printLayout.querySelectorAll('.note-preview').forEach(div => div.className = 'note-section');
        }

        function downloadPDF() {
            const printLayout = document.getElementById('printLayout');
            if (!printLayout.innerHTML) return;
            
            const element = document.createElement('div');
            element.style.width = '215.9mm';
            element.innerHTML = printLayout.innerHTML;
            element.querySelectorAll('.note-section').forEach(s => s.className = 'pdf-section');
            
            const opt = { 
                margin: 0, 
                filename: 'encomiendas_arelyshop.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2, useCORS: true }, 
                jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' } 
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = () => { renderInputs(); updatePreview(); };
    </script>
</body>
</html>
