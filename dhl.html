<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Sistema de Etiquetas - Arelyshop</title>
    
    <!-- Favicon Verde Personalizado -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960'%3E%3Cpath fill='%2387e64b' d='M440-183v-274L200-596v274l240 139Zm80 0 240-139v-274L520-457v274Zm-80 92L160-252q-19-11-29.5-29T120-321v-318q0-22 10.5-40t29.5-29l280-161q19-11 40-11t40 11l280 161q19 11 29.5 29t10.5 40v318q0 22-10.5 40T800-252L520-91q-19 11-40 11t-40-11Zm200-528 77-44-237-137-78 45 238 136Zm-160 93 78-45-237-137-78 45 237 137Z'/%3E%3C/svg%3E" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @media print {
            @page { size: letter portrait; margin: 0; }
            body { margin: 0; padding: 0; background: white; }
            .no-print { display: none !important; }
            #printLayout { display: block !important; width: 215.9mm; height: 279.4mm; margin: 0; }
            .note-section {
                height: 33.3333%;
                border-bottom: 1px dashed #000;
                padding: 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                page-break-inside: avoid;
            }
            .note-section:last-child { border-bottom: 1px dashed #000; }
            .inner-box { width: 85% !important; }
        }

        .preview-container { background-color: #f3f4f6; min-height: 100vh; padding: 20px; }
        .page-shadow {
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background: white;
            width: 215.9mm;
            height: 279.4mm;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        .note-preview {
            height: 33.3333%;
            border-bottom: 1px dashed #ccc;
            padding: 1.5rem;
            position: relative;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        .inner-box { width: 85%; height: 100%; }
        input { text-transform: uppercase; }

        .pdf-section {
            height: 93.13mm; 
            width: 215.9mm;
            border-bottom: 1px dashed #000;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 100;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            max-height: 200px;
            overflow-y: auto;
        }
        .dropdown-content button {
            width: 100%;
            text-align: left;
            padding: 8px 16px;
            font-size: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        .dropdown-content button:hover { background-color: #f3f4f6; }
        .show { display: block; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #1e3a8a; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="bg-gray-100 font-sans" onclick="closeAllDropdowns(event)">

    <div class="no-print max-w-5xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-900 uppercase tracking-tight">Arelyshop.com</h1>
            <p class="text-gray-600 font-medium italic">Gestión de Logística</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-blue-800">
            <!-- Contenedor de Entradas -->
            <div id="inputsContainer" class="space-y-6"></div>

            <div class="flex flex-wrap items-center justify-between gap-4 border-t mt-8 pt-6">
                <!-- Botón para añadir nota -->
                <button onclick="addNoteSlot()" id="btnAdd" class="bg-blue-100 hover:bg-blue-200 text-blue-900 font-bold py-2.5 px-6 rounded-lg flex items-center gap-2 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
                    Añadir otro envío
                </button>

                <div class="flex gap-4">
                    <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full flex items-center gap-2 shadow-md transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m480-280 160-160-56-56-64 62v-166h-80v166l-64-62-56 56 160 160ZM240-80q-33 0-56.5-23.5T160-160v-480l240-240h320q33 0 56.5 23.5T800-800v640q0 33-23.5 56.5T720-80H240Zm0-80h480v-640H434L240-606v446Zm0 0h480-480Z"/></svg>
                        PDF
                    </button>
                    <button onclick="safePrint()" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-10 rounded-full flex items-center gap-2 shadow-md transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M640-640v-120H320v120h-80v-200h480v200h-80Zm-480 80h640-640Zm560 100q17 0 28.5-11.5T760-500q0-17-11.5-28.5T720-540q-17 0-28.5 11.5T680-500q0 17 11.5 28.5T720-460Zm-80 260v-160H320v160h320Zm80 80H240v-160H80v-240q0-51 35-85.5t85-34.5h560q51 0 85.5 34.5T880-520v240H720v160Zm80-240v-160q0-17-11.5-28.5T760-560H200q-17 0-28.5 11.5T160-520v160h80v-80h480v80h80Z"/></svg>
                        Imprimir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-container flex justify-center py-10 no-print">
        <div class="page-shadow" id="printableArea"></div>
    </div>

    <div id="printLayout" class="hidden"></div>

    <script>
        const departamentos = ["LA PAZ", "SANTA CRUZ", "COCHABAMBA", "ORURO", "POTOSÍ", "TARIJA", "SUCRE", "BENI", "PANDO"];
        const originalTitle = document.title;
        
        // Estado inicial
        let slotsCount = 1;
        let states = [
            { id: 0, visible: true },
            { id: 1, visible: true },
            { id: 2, visible: true }
        ];

        function createInputGroup(id) {
            const div = document.createElement('div');
            const active = states[id].visible;
            div.className = `p-4 rounded-lg border transition-all ${active ? 'bg-white border-blue-200 shadow-sm' : 'bg-gray-50 border-gray-200 opacity-60'}`;
            
            div.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <span class="${active ? 'bg-blue-800' : 'bg-gray-400'} text-white text-[10px] font-bold px-2 py-1 rounded tracking-widest uppercase">ENVÍO #${id + 1}</span>
                        ${id > 0 ? `<button onclick="removeSlot(${id})" class="text-red-400 hover:text-red-600 text-[10px] font-bold uppercase underline">Eliminar</button>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold text-gray-400 uppercase">${active ? 'En hoja' : 'Oculto'}</span>
                        <label class="switch">
                            <input type="checkbox" id="v-${id}" ${active ? 'checked' : ''} onchange="toggleV(${id})">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 ${active ? '' : 'pointer-events-none grayscale opacity-40'}">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Nombre:</label>
                        <input type="text" id="a-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Celular:</label>
                        <input type="text" id="b-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">C.I.:</label>
                        <input type="text" id="c-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="updatePreview()">
                    </div>
                    <div class="relative">
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">DESTINO:</label>
                        <div class="flex">
                            <input type="text" id="d-${id}" autocomplete="off" class="w-full p-2 border border-gray-300 rounded-l text-sm font-bold" oninput="updatePreview()">
                            <button onclick="toggleD(event, ${id})" class="bg-gray-200 border border-gray-300 border-l-0 px-2 rounded-r hover:bg-gray-300 transition-colors text-[10px]">▼</button>
                        </div>
                        <div id="drop-${id}" class="dropdown-content">
                            ${departamentos.map(dep => `<button onclick="setL(${id}, '${dep}')">${dep}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function addNoteSlot() {
            if (slotsCount < 3) {
                slotsCount++;
                renderAll();
                updatePreview();
            }
            updateAddButton();
        }

        function removeSlot(id) {
            if (slotsCount > 1) {
                slotsCount--;
                renderAll();
                updatePreview();
            }
            updateAddButton();
        }

        function updateAddButton() {
            const btn = document.getElementById('btnAdd');
            btn.style.display = slotsCount >= 3 ? 'none' : 'flex';
        }

        function toggleV(id) {
            states[id].visible = document.getElementById(`v-${id}`).checked;
            renderAll();
            updatePreview();
        }

        function toggleD(e, id) {
            e.stopPropagation();
            const list = document.getElementById(`drop-${id}`);
            const wasOpen = list.classList.contains('show');
            closeAllDropdowns();
            if (!wasOpen) list.classList.add("show");
        }

        function setL(id, val) {
            document.getElementById(`d-${id}`).value = val;
            updatePreview();
            closeAllDropdowns();
        }

        function closeAllDropdowns() {
            document.querySelectorAll(".dropdown-content").forEach(d => d.classList.remove('show'));
        }

        function renderAll() {
            const container = document.getElementById('inputsContainer');
            const data = [];
            // Respaldar datos actuales
            for (let i = 0; i < 3; i++) {
                data.push({
                    a: document.getElementById(`a-${i}`)?.value || "",
                    b: document.getElementById(`b-${i}`)?.value || "",
                    c: document.getElementById(`c-${i}`)?.value || "",
                    d: document.getElementById(`d-${i}`)?.value || ""
                });
            }
            container.innerHTML = "";
            for (let i = 0; i < slotsCount; i++) {
                container.appendChild(createInputGroup(i));
                if (data[i]) {
                    document.getElementById(`a-${i}`).value = data[i].a;
                    document.getElementById(`b-${i}`).value = data[i].b;
                    document.getElementById(`c-${i}`).value = data[i].c;
                    document.getElementById(`d-${i}`).value = data[i].d;
                }
            }
        }

        function generateNoteHTML(nombre, cel, ci, destino, fecha, visible) {
            if (!visible) return `<div class="note-preview"><div class="inner-box border-4 border-transparent"></div></div>`;

            const n = nombre.trim() || "N/A";
            const t = cel.trim() || "N/A";
            const i = ci.trim() || "N/A";
            const l = destino.trim() || "N/A";

            return `
                <div class="note-preview">
                    <div class="inner-box border-4 border-blue-900 p-6 flex flex-col justify-between rounded-lg bg-white">
                        <div class="flex justify-between items-start">
                            <h2 class="text-3xl font-black text-blue-900 italic uppercase tracking-tighter">Arelyshop.com</h2>
                            <div class="text-right"><p class="text-[11px] font-bold text-gray-700 bg-gray-100 px-2 py-1 rounded uppercase">FECHA: ${fecha}</p></div>
                        </div>
                        <div class="space-y-4 my-2">
                            <div class="flex items-end gap-2">
                                <span class="font-bold text-lg text-gray-700 uppercase min-w-[100px]">Nombre:</span>
                                <div class="border-b-2 border-dotted border-gray-400 flex-grow text-2xl font-bold px-2 text-black uppercase truncate leading-tight">${n}</div>
                            </div>
                            <div class="flex gap-4">
                                <div class="flex items-end gap-2 flex-1">
                                    <span class="font-bold text-lg text-gray-700 uppercase">CEL:</span>
                                    <div class="border-b-2 border-dotted border-gray-400 flex-grow text-2xl font-bold px-2 text-black uppercase leading-tight">${t}</div>
                                </div>
                                <div class="flex items-end gap-2 flex-1">
                                    <span class="font-bold text-lg text-gray-700 uppercase">C.I.:</span>
                                    <div class="border-b-2 border-dotted border-gray-400 flex-grow text-2xl font-bold px-2 text-black uppercase leading-tight">${i}</div>
                                </div>
                            </div>
                            <div class="flex items-end gap-2">
                                <span class="font-bold text-lg text-gray-700 uppercase min-w-[100px]">Destino:</span>
                                <div class="border-b-2 border-dotted border-gray-400 flex-grow text-4xl font-black text-blue-800 px-2 uppercase leading-none">${l}</div>
                            </div>
                        </div>
                        <div class="text-center mt-2 border-t border-gray-100 pt-2"><p class="text-xl font-bold text-blue-900 italic uppercase">¡Gracias por comprar en Arelyshop.com!</p></div>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const container = document.getElementById('printableArea');
            container.innerHTML = "";
            const fecha = new Date().toLocaleDateString('es-BO', {day: '2-digit', month: '2-digit', year: 'numeric'});
            
            for (let i = 0; i < slotsCount; i++) {
                const n = document.getElementById(`a-${i}`)?.value.toUpperCase() || "";
                const t = document.getElementById(`b-${i}`)?.value.toUpperCase() || "";
                const ic = document.getElementById(`c-${i}`)?.value.toUpperCase() || "";
                const l = document.getElementById(`d-${i}`)?.value.toUpperCase() || "";
                container.innerHTML += generateNoteHTML(n, t, ic, l, fecha, states[i].visible);
            }
            
            // Si hay menos de 3 slots, rellenamos el resto con espacios transparentes para mantener la estructura de la hoja
            for (let i = slotsCount; i < 3; i++) {
                container.innerHTML += `<div class="note-preview"><div class="inner-box"></div></div>`;
            }

            const layout = document.getElementById('printLayout');
            layout.innerHTML = container.innerHTML;
            layout.querySelectorAll('.note-preview').forEach(div => div.className = 'note-section');
        }

        function downloadPDF() {
            const layout = document.getElementById('printLayout');
            if (!layout.innerHTML) return;
            const element = document.createElement('div');
            element.style.width = '215.9mm';
            element.innerHTML = layout.innerHTML;
            element.querySelectorAll('.note-section').forEach(s => s.className = 'pdf-section');
            const opt = { 
                margin: 0, 
                filename: 'etiquetas_arelyshop.pdf', 
                image: { type: 'jpeg', quality: 0.98 }, 
                html2canvas: { scale: 2, useCORS: true }, 
                jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' } 
            };
            html2pdf().set(opt).from(element).save();
        }

        function safePrint() {
            document.title = " ";
            window.print();
            setTimeout(() => { document.title = originalTitle; }, 100);
        }

        window.onload = () => { renderAll(); updatePreview(); };
    </script>
</body>
</html>
